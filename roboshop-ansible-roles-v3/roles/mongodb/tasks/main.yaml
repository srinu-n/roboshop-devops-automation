- name: copy the repo from the template mongo repo location
  template:
    src: mongo_repo.j2
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb org
  package:
    name: "{{ component }}-org"
    state: present

- name: start and enabled the mongodb service
  service:
    name: mongod
    state: started
    enabled: true

- name: Update listen address from 127.0.0.1 to 0.0.0.0 in /etc/mongod.conf
  replace:
    path: /etc/mongod.conf
    regexp: "127.0.0.1"
    replace: "0.0.0.0"
  notify:
    - restart mongod
