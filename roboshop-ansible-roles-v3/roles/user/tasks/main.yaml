- name: install the nodejs application using the role
  include_role:
    name: nodejs

- name: copy the service file
  template:
    src: user_file.j2
    dest: "/etc/systemd/system/{{ component }}.service"

- name: start and enable the service
  systemd:
    name: "{{ component }}"
    state: started
    enabled: true
    daemon_reload: yes
