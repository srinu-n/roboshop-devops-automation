- name: setting up payments service for the roboshop
  hosts: payments
  become: yes
  tasks:
    - name: install the python3 and pip3
      dnf:
        name: "{{ item }}"
        state: present
      loop:
        - python3
        - gcc
        - python3-devel

    - name: create a system user for the roboshop
      user:
        name: roboshop
        shell: /sbin/nologin
        comment: 'roboshop system user'
        system: true
        home: /app

    - name: create the /app directory to download the code
      file:
        path: /app
        state: directory
    
    - name: download the code
      get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
        dest: /tmp/payment.zip

    - name: unzip the code
      unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: install the dependencies
      pip:
        requirements: /app/requirements.txt
        executable: pip3
    
    - name: copy the service file
      copy: 
        src: payements_service.file
        dest: /etc/systemd/system/payment.service

    - name: daemon reload
      systemd:
        daemon_reload: yes
      
    - name: start and enable the service
      systemd:
        name: payment
        state: started
        enabled: true