  - name: enable the node js
    command: dnf module enable nodejs:20 -y

  - name: install nodejs
    dnf:
      name: "{{ item }}"
      state: present
    loop:
      - nodejs
      - mongodb-mongosh
  
  - name: create a system user for the roboshop
    user:
      name: roboshop
      shell: /sbin/nologin
      comment: 'roboshop system user'
      system: true
      home: /app

  - name: create the /app directory to download the code
    file:
      path: /app
      state: directory
  
  - name: download the code
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
      dest: "/tmp/{{ component }}.zip"

  - name: unzip the code
    unarchive:
      src: "/tmp/{{ component }}.zip"
      dest: /app
      remote_src: yes
  
  - name: install the dependencies
    command: 
      cmd: npm install
      chdir: /app


  - name: copy the service file
    template: 
      src: catalogue_service.j2
      dest: "/etc/systemd/system/{{ component }}.service"
    
  - name: start and enable the service
    systemd:
      name: "{{ component }}"
      state: started
      enabled: true
      daemon_reload: yes


  - name: copy the mongo client repo to /etc/yum.repos.d/mongo.repo
    copy: 
      src: mongosh_repo.j2
      dest: /etc/yum.repos.d/mongo.repo

  

  - name: load the catalogue master data
    shell: mongosh --host roboshop-mongodb.srinun.in catalogue < /app/db/master-data.js
