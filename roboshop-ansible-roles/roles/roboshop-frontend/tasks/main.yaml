
  - name: enable the nginx module
    command: dnf module enable nginx:1.24 -y
  
  - name: install the nginx
    dnf:
      name: nginx 
      state: present
  
  - name: enable and start nginx
    systemd:
      name: nginx
      enabled: true
      state: started

  - name: remove the default content /usr/share/nginx/html/*
    shell: rm -rf /usr/share/nginx/html/*
  
  - name: download the frontend content
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
      dest: "/tmp/{{ component }}.zip"


  - name: un archive the frontend file
    unarchive:
      src: "/tmp/{{ component }}.zip"
      dest: /usr/share/nginx/html
      remote_src: true 

  - name: copy the config file to this location /etc/nginx/nginx.conf using the template module
    template:
      src: nginx_service.j2
      dest: /etc/nginx/nginx.conf

  - name: enable and re start the services
    systemd:
      name: nginx
      state: restarted
      enabled: true
      
  

