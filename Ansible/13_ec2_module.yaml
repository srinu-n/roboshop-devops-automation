- name: create the infra for the roboshop
  connection: local
  hosts: local
  vars:
    machine_name: [ 'frontend', 'paymemt' ]
    instance_type: t3.micro
    ami_id: ami-0055977a6e828a4f4
    desired_region: us-east-1
    # prefix: roboshop
  tasks:
    - name: create the ec2-machine
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        vpc_subnet_id: subnet-031fd246742193653 
        security_groups:
          - common-sg
          - "roboshop-{{ item }}"
        wait: yes
        region: "{{ desired_region }}"
      loop: "{{ machine_name }}"

