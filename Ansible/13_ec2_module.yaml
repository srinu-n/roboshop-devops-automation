- name: create the infra for the roboshop
  connection: local
  hosts: local
  vars:
    machine_name: [ 'mongodb', 'catalogue', 'user', 'payments', 'cart', 'shipping', 'mysql', 'redis', 'rabbitmq', 'frontend' ]
    instance_type: t3.micro
    ami_id: ami-0055977a6e828a4f4
    desired_region: us-east-1
    action: create
    zone: srinun.in
  tasks:
    - name: create the ec2-machine
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        vpc_subnet_id: subnet-031fd246742193653 
        security_groups:
          - common-sg
          - "roboshop-{{ item }}"
        wait: yes
        region: "{{ desired_region }}"
      loop: "{{ machine_name }}"
      when: action == 'create'
      register: ec2_result


    - name: delete the ec2 machine if action is delete
      amazon.aws.ec2_instance:
        state: absent
        filters:
              instance-state-name: running
        region: "{{ desired_region }}"
      when: action == 'delete' 

        
    - name: get the pvt ip and update r53 record
      amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        record: "roboshop-{{ item.item }}.{{ zone }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: yes
      loop: "{{ ec2_result.results }}"
      when: action == 'create'

    - name: update the public ip if name of the machine is frontend
      amazon.aws.route53:
        state: present
        zone: "{{ zone }}"
        record: "roboshop.{{ zone }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: yes
      loop: "{{ ec2_result.results }}"
      when: item.item == 'frontend' and action == 'create'
