- name: varibles from the prompt
  hosts: webServers
  vars_prompt:
    -  name: username
       prompt: what is your name?
       private: false
      
    - name: password
      prompt: enter the password
      private: true

  
  tasks:
    - name: print the username & password
      debug:
        msg: Hi my name is "{{ username }}" and password is "{{ password }}"
