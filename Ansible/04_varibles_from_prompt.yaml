- name: varibles from the prompt
  hosts: webServers
  vars_prompt:
    -  user_name: username
       prompt: what is your name?
       private: false
      
    - user_password: password
      prompt: enter the password
      private: true

  
  tasks:
    - name: print the username & password
      debug:
        msg: Hi my name is "{{ user_name }}" and password is "{{ user_password }}"
