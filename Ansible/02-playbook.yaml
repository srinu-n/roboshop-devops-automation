- name: learning about the varibles in ansible
  hosts: webServers
  become: yes
  become_user: root
  vars:
    my_name: Srinivasulu   # name is a reserved varible not recommended to use
    age: 30
    technology: DevOps
    location: Hyderabad
  tasks:
    - name: print the varibles
      debug:
        msg: Hi my name is "{{ my_name  }}", i am from "{{ location }}", and my age is ""   # nothing provided means it will print the default message hello world