- name: working on loops 
  hosts: webServers
  become: yes

  tasks:
    - name: install the packages using loops
      package: 
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop:
        - { name: nginx, state: absent}
        - { name: httpd, state: absent}
        - { name: vim, state: present}
        - { name: git, state: present}




